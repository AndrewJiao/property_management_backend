[workspace]
members = [
    "common",
    "controller",
    "service",
    "repository",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"


[workspace.dependencies]
serde = { version = "1.0.215", features = ["derive"], workspace = true }
serde_json = { version = "1.0.132", workspace = true }
chrono = { version = "0.4.38", workspace = true }
uuid = { version = "1.11.0", workspace = true }
thiserror = { version = "2.0.3", workspace = true }
log = { version = "0.4.22"}
log4rs = "1.3.0"
config = "0.14.1"
quote = "1.0.33"
syn = { version = "2.0.43", features = ["full"], default-features = true }
actix-web = "4.9.0"
lazy_static = "1.4.0"
derive_more = { version = "1.0.0", features = ["full"] }
diesel = { version = "2.2.4", features = ["postgres", "r2d2"] }
pq-sys = { version = "0.6", features = ["bundled_without_openssl"] }

[workspace]
members = [
    "common",
    "controller",
    "service",
    "repository",
    "management_macro",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"


[workspace.dependencies]
serde = { version = "1.0.215", features = ["derive"], workspace = true }
serde_json = { version = "1.0.132", workspace = true }
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.11.0", workspace = true }
thiserror = { version = "2.0.3" }
anyhow = "1.0.93"

parking_lot = { version = "0.12.3", features = ["arc_lock"] }

log = { version = "0.4.22" }
log4rs = "1.3.0"
config = "0.14.1"
quote = "1.0.33"
syn = { version = "2.0.43", features = ["full"], default-features = true }
actix-web = "4.9.0"
actix = "0.13.5"
lazy_static = "1.4.0"
derive_more = { version = "1.0.0", features = ["full"] }
diesel = { version = "2.2.4", features = ["postgres", "r2d2", "chrono", "numeric", "serde_json"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
diesel_logger = "0.4.0"

pq-sys = { version = "0.6", features = ["bundled_without_openssl"] }
bigdecimal = { version = "0.4.6", features = ["serde"] }
pg_bigdecimal = "0.1.5"
validator = { version = "0.19", features = ["derive"] }
actix-cors = "0.7.0"
tracing-actix-web = "0.7.15"

base64 = "0.22.1"
sha256 = "1.5.0"
base16 = "0.2.1"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"

itertools = "0.13.0"
tokio = { version = "1.42.0", features = ["full"] }
reqwest = { version = "0.12.9", features = ["json"] }
rayon = { version = "1.8"}

rust_xlsxwriter = "0.80.0"
futures = "0.3.31"
regex = "1.11.1"

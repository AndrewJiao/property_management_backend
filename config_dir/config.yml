# This is a sample configuration file for the application
web_config:
  port: 8080
  host: "127.0.0.1"
  shutting_down_timeout: 30
  keep_alive: 30

# Database configuration
databases:
  user: "postgres"
  password: "postgres"
  host: "localhost"
  port: 5432
  database: "property_management"
  database_url: "postgres://postgres:postgres@localhost:5432/property_management?options=-c%20search_path%3Dbasic"

# 应用配置
app_config:
  json_length: 10000
  number_max: 100000000
  number_min: -100000000
  record_max: 2 #生成多少条流水就创建新的记录
  liquidated_damages_rate: 0.1 #违约金比例
excel_config:
  basic_height: 31.5
  basic_width: 9